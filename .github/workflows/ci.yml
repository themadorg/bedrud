name: CI

on:
  push:
    branches: [master]
  # No `branches` filter: that one matches the *base*, so a pull request
  # stacked on another branch got no CI at all — not a red tick, nothing.
  # Every pull request is gated, whatever it targets.
  pull_request:
  # A daily run with every path filter off. A push only ever answers "what did this
  # commit touch", so a job nothing routed to is a job nobody heard from — and
  # `Server – Tests` staying silent for two days is how a queue regression
  # reached master. This bounds that to a day, and it is the only run that
  # proves master still builds and passes from scratch rather than from the
  # last commit that happened to touch the right tree.
  #
  # 03:37 rather than a round hour: scheduled runs queue behind everyone else's
  # on-the-hour cron and can be delayed by tens of minutes.
  schedule:
    - cron: "37 3 * * *"
  # The same unfiltered run, on demand — for confirming a fix without waiting
  # for the next scheduled one, or after changing the filters themselves.
  workflow_dispatch:

concurrency:
  # A pull request groups by ref, so a new push supersedes the run before it —
  # only the newest commit on a branch is worth an answer.
  #
  # Everything else groups by commit, which means it never shares a group and is
  # therefore never superseded at all. That is the other half of how a queue
  # regression stayed hidden for two days: `ci-${{ github.ref }}` put every push
  # to master in one group, so a merge landing on top of another cancelled the
  # first one's tests and no commit ever reported on them. Grouping by ref with
  # `cancel-in-progress: false` would not have fixed it either — a third run
  # arriving cancels the *pending* second one, and that commit still ends up
  # with no result. Per-commit is the only grouping where every commit on master
  # keeps its own answer.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Path filters: only run jobs when their trees change ──
  #
  # Separation of concerns:
  #   apps/web     → meeting product UI (embedded in Go binary / Docker)
  #   apps/site    → landing + public docs (GitHub Pages only)
  #   docs/        → repo/developer markdown (not the binary). If ONLY this
  #                  changes, run nothing except site/landing deploy path.
  #   server/      → Go API; site rebuilds too (copies server/docs/swagger.json)
  #
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each output is "did this tree change" OR "we are not filtering at all".
    # The second half is what makes the scheduled and workflow_dispatch runs whole:
    # every job runs, whatever the diff says.
    outputs:
      server: ${{ steps.mode.outputs.unfiltered == 'true' || steps.filter.outputs.server == 'true' }}
      web: ${{ steps.mode.outputs.unfiltered == 'true' || steps.filter.outputs.web == 'true' }}
      site: ${{ steps.mode.outputs.unfiltered == 'true' || steps.filter.outputs.site == 'true' }}
      desktop: ${{ steps.mode.outputs.unfiltered == 'true' || steps.filter.outputs.desktop == 'true' }}
      ios: ${{ steps.mode.outputs.unfiltered == 'true' || steps.filter.outputs.ios == 'true' }}
      devcli: ${{ steps.mode.outputs.unfiltered == 'true' || steps.filter.outputs.devcli == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A scheduled or dispatched run has no "before" commit to diff against, so
      # the filter below would have nothing to answer even if we wanted it to.
      # Skipping it outright says why in one place rather than leaving an empty
      # result to be interpreted downstream.
      - name: Decide whether to filter at all
        id: mode
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) unfiltered=true ;;
            *)                          unfiltered=false ;;
          esac
          echo "unfiltered=$unfiltered" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT unfiltered=$unfiltered"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: steps.mode.outputs.unfiltered != 'true'
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            # Landing + public docs only. Includes root docs/ so docs-only pushes
            # still refresh the site path when relevant, without building products.
            site:
              - 'apps/site/**'
              - 'docs/**'
              - 'server/docs/**'
              - 'server/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-site.yml'
            desktop:
              - 'apps/desktop/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            ios:
              - 'apps/ios/**'
              - '.github/workflows/ci.yml'
            # Local dev tooling. Not part of the binary, but it has a real test
            # suite and nothing was running it.
            devcli:
              - 'apps/dev/devcli/**'
              - '.github/workflows/ci.yml'

  # ── Server (Go) ───────────────────────────────────────────────
  server:
    name: Server – Build & Vet
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - run: go mod download
      # Create placeholders for //go:embed directives
      - run: mkdir -p frontend && touch frontend/.gitkeep
      - run: mkdir -p internal/livekit/bin && touch internal/livekit/bin/livekit-server
      - run: go vet ./...
      - run: go build ./...

  server-test:
    name: Server – Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, server]
    if: needs.changes.outputs.server == 'true'
    defaults:
      run:
        working-directory: server
    # RunMigrations branches on the SQL dialect, and the suite otherwise only
    # ever sees SQLite. Tests needing this skip themselves when the DSN below
    # is absent, so `go test ./...` still works locally with no server.
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: bedrud
          POSTGRES_PASSWORD: bedrud
          POSTGRES_DB: bedrud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bedrud -d bedrud_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - run: go mod download
      - run: mkdir -p frontend && touch frontend/.gitkeep
      - run: mkdir -p internal/livekit/bin && touch internal/livekit/bin/livekit-server
      - run: go test -race -count=1 ./...
        env:
          BEDRUD_TEST_POSTGRES_DSN: host=localhost user=bedrud password=bedrud dbname=bedrud_test port=5432 sslmode=disable
          # Turns a missing DSN into a failure instead of a silent skip. Without
          # it, dropping the line above would take the Postgres dialect with it
          # and still show green, since `go test` hides skipped subtests.
          BEDRUD_TEST_POSTGRES_REQUIRED: "1"

  # ── Web (React meeting app — embedded in binary) ──────────────
  web:
    name: Web – Build & Check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  # ── devcli (Go dev tooling) ───────────────────────────────────
  devcli:
    name: devcli – Tests
    needs: changes
    if: needs.changes.outputs.devcli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dev/devcli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/dev/devcli/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # ── iOS ───────────────────────────────────────────────────────
  ios:
    name: iOS – Build & Test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/ios/.spm-cache
          key: ios-spm-${{ hashFiles('apps/ios/Bedrud.xcodeproj/project.pbxproj') }}
          restore-keys: ios-spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Bedrud.xcodeproj \
            -scheme Bedrud \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Build for testing with coverage
        run: |
          xcodebuild build-for-testing \
            -project Bedrud.xcodeproj \
            -scheme Bedrud \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -clonedSourcePackagesDirPath .spm-cache \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run tests with coverage
        run: |
          xcodebuild test-without-building \
            -project Bedrud.xcodeproj \
            -scheme Bedrud \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Generate coverage report
        run: |
          xcrun xccov view --report TestResults.xcresult | tee coverage-report.txt

      - name: Calculate coverage percentage
        id: coverage
        run: |
          # Extract line coverage from xccov report
          COVERAGE=$(xcrun xccov view --report --json TestResults.xcresult | jq -r '.targets[0].lineCoverage * 100 | floor')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

          # Create summary
          echo "## iOS Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Line Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files with low coverage (<50%)" >> $GITHUB_STEP_SUMMARY
          xcrun xccov view --report --json TestResults.xcresult | \
            jq -r '.targets[].files[] | select(.lineCoverage < 0.5) | "\(.path): \(.lineCoverage * 100 | floor)% coverage"' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-coverage-report
          path: apps/ios/coverage-report.txt
          retention-days: 30

  # ── Desktop (Rust/Slint) ──────────────────────────────────────
  desktop:
    name: Desktop – Build & Test
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"
      - name: Install Slint dependencies (Linux)
        timeout-minutes: 10
        run: |
          apt_opts=(-o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get update "${apt_opts[@]}"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${apt_opts[@]}" \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libasound2-dev
      - name: Build
        run: cargo build -p bedrud-desktop
      - name: Test
        run: cargo test -p bedrud-desktop

  # ── Site (Astro landing + public docs) ─────────────────────────
  # Not part of the Go binary / Docker image.
  # If ONLY docs/ (or apps/site) changes, this is the only product-ish job that runs.
  site:
    name: Site – Build & Check
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
          cache: true
      - run: bun install --frozen-lockfile
      - name: Sync swagger.json from server
        run: mkdir -p public && cp ../../server/docs/swagger.json public/swagger.json
      - run: bun run check
      - run: bun run typecheck:astro
      - run: bun run build

  # ── Reporting for the scheduled run ─────────────────────────────────────────
  #
  # A scheduled run that goes red where nobody looks is barely better than no
  # scheduled run at all. GitHub's own notification for a failed scheduled workflow goes
  # to whoever last touched the workflow file, which is not the same as whoever
  # broke master.
  #
  # So the same shape as check-android-pin.yml: one open tracking issue at a
  # time, found by label rather than by title so the lookup keeps working
  # however the title is worded, its body refreshed while master stays broken,
  # closed once a scheduled run passes again.
  # It reports only — nothing here reverts, reruns or pushes.
  #
  # Deliberately not on pull_request or push: those already show a red tick on
  # something a person is looking at.
  scheduled-report:
    name: Scheduled – report
    # always(), or a failed job upstream would skip the reporting too — which is
    # precisely the case that has to be reported.
    if: always() && github.event_name == 'schedule'
    needs: [changes, server, server-test, web, devcli, ios, desktop, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      # Declaring any permissions block zeroes the rest, and the step below
      # reads GET /actions/runs/{id}/jobs, which is documented as actions: read.
      # A public repo may serve it unauthenticated, but that is a thin thing to
      # rely on in the one step that only ever runs when master is broken.
      actions: read
    env:
      TRACKER_LABEL: scheduled-ci
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A cancelled job counts as broken: this run is never superseded, so a
      # cancellation means something went wrong rather than something newer won.
      BROKEN: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      # Asked of the API rather than assembled from the needs context, so adding
      # a job to this workflow does not silently drop it out of the report.
      - name: Collect the failed jobs
        id: failed
        run: |
          names=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
                  --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")
                         | "- **\(.name)** — \(.conclusion)"] | join("\n")') || names=""
          {
            echo "list<<EOF"
            echo "${names:-- (no individual job reported a conclusion)}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Look for the tracking issue
        id: tracker
        run: |
          # The label does not exist until the first issue is filed, and gh
          # reports an unknown label as an error rather than an empty list.
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$TRACKER_LABEL" \
                --state open --limit 1 --json number --jq '.[0].number // empty' \
                2>/dev/null || true)
          echo "number=$num" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the tracking issue
        if: env.BROKEN == 'true'
        env:
          NUM: ${{ steps.tracker.outputs.number }}
          FAILED_LIST: ${{ steps.failed.outputs.list }}
          SHA: ${{ github.sha }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="The scheduled unfiltered CI run is failing on master"

          cat > /tmp/body.md <<EOF
          The scheduled unfiltered run of \`.github/workflows/ci.yml\` did not pass on \`master\`.

          | | |
          |---|---|
          | commit | \`$SHA\` |
          | run | [#$GITHUB_RUN_NUMBER]($run_url) |

          $FAILED_LIST

          This run applies no path filters, so it covers jobs a push may skip. A
          failure here that no pull request showed means the break reached master
          through a commit that did not route to the job that catches it.

          <sub>Kept current by the \`scheduled-report\` job in \`.github/workflows/ci.yml\`,
          which closes this issue once a scheduled run passes.</sub>
          EOF

          if [ -z "$NUM" ]; then
            # --force so a deleted label repairs itself instead of failing the run.
            gh label create "$TRACKER_LABEL" --repo "$GITHUB_REPOSITORY" --force \
              --color B60205 --description "The scheduled unfiltered CI run is failing on master" >/dev/null

            # github_actions rather than a ci label: gh rejects an unknown label
            # outright, and filing this issue is the one thing that must not
            # fail when master breaks. github_actions already exists in
            # this repo; a made-up second label would have to be created here
            # too, for no gain.
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file /tmp/body.md --label "$TRACKER_LABEL" --label github_actions
            exit 0
          fi

          # Only the body is refreshed: the title is fixed, and the run number,
          # commit and failing jobs it would otherwise carry all live in the body.
          #
          # Edited rather than commented on. A comment every 24 hours about a
          # break somebody is already working through is how a reminder trains
          # people to mute it.
          gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
          echo "Refreshed #$NUM"

      - name: Close the tracking issue
        if: env.BROKEN != 'true' && steps.tracker.outputs.number != ''
        env:
          NUM: ${{ steps.tracker.outputs.number }}
          SHA: ${{ github.sha }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" \
            --comment "The scheduled run passed on \`$SHA\` ([run #$GITHUB_RUN_NUMBER]($run_url)) — closing."
