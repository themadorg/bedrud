name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Path filters: only run jobs when their trees change ──
  #
  # Separation of concerns:
  #   apps/web     → meeting product UI (embedded in Go binary / Docker)
  #   apps/site    → landing + public docs (GitHub Pages only)
  #   docs/        → repo/developer markdown (not the binary). If ONLY this
  #                  changes, run nothing except site/landing deploy path.
  #   server/      → Go API; site rebuilds too (copies server/docs/swagger.json)
  #
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      site: ${{ steps.filter.outputs.site }}
      desktop: ${{ steps.filter.outputs.desktop }}
      ios: ${{ steps.filter.outputs.ios }}
      devcli: ${{ steps.filter.outputs.devcli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            # Landing + public docs only. Includes root docs/ so docs-only pushes
            # still refresh the site path when relevant, without building products.
            site:
              - 'apps/site/**'
              - 'docs/**'
              - 'server/docs/**'
              - 'server/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-site.yml'
            desktop:
              - 'apps/desktop/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            ios:
              - 'apps/ios/**'
              - '.github/workflows/ci.yml'
            # Local dev tooling. Not part of the binary, but it has a real test
            # suite and nothing was running it.
            devcli:
              - 'apps/dev/devcli/**'
              - '.github/workflows/ci.yml'

  # ── Server (Go) ───────────────────────────────────────────────
  server:
    name: Server – Build & Vet
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - run: go mod download
      # Create placeholders for //go:embed directives
      - run: mkdir -p frontend && touch frontend/.gitkeep
      - run: mkdir -p internal/livekit/bin && touch internal/livekit/bin/livekit-server
      - run: go vet ./...
      - run: go build ./...

  server-test:
    name: Server – Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, server]
    if: needs.changes.outputs.server == 'true'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - run: go mod download
      - run: mkdir -p frontend && touch frontend/.gitkeep
      - run: mkdir -p internal/livekit/bin && touch internal/livekit/bin/livekit-server
      - run: go test -race -count=1 ./...

  # ── Web (React meeting app — embedded in binary) ──────────────
  web:
    name: Web – Build & Check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  # ── devcli (Go dev tooling) ───────────────────────────────────
  devcli:
    name: devcli – Tests
    needs: changes
    if: needs.changes.outputs.devcli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dev/devcli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: apps/dev/devcli/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # ── iOS ───────────────────────────────────────────────────────
  ios:
    name: iOS – Build & Test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/ios/.spm-cache
          key: ios-spm-${{ hashFiles('apps/ios/Bedrud.xcodeproj/project.pbxproj') }}
          restore-keys: ios-spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Bedrud.xcodeproj \
            -scheme Bedrud \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Build for testing with coverage
        run: |
          xcodebuild build-for-testing \
            -project Bedrud.xcodeproj \
            -scheme Bedrud \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -clonedSourcePackagesDirPath .spm-cache \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run tests with coverage
        run: |
          xcodebuild test-without-building \
            -project Bedrud.xcodeproj \
            -scheme Bedrud \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Generate coverage report
        run: |
          xcrun xccov view --report TestResults.xcresult | tee coverage-report.txt

      - name: Calculate coverage percentage
        id: coverage
        run: |
          # Extract line coverage from xccov report
          COVERAGE=$(xcrun xccov view --report --json TestResults.xcresult | jq -r '.targets[0].lineCoverage * 100 | floor')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

          # Create summary
          echo "## iOS Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Line Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files with low coverage (<50%)" >> $GITHUB_STEP_SUMMARY
          xcrun xccov view --report --json TestResults.xcresult | \
            jq -r '.targets[].files[] | select(.lineCoverage < 0.5) | "\(.path): \(.lineCoverage * 100 | floor)% coverage"' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-coverage-report
          path: apps/ios/coverage-report.txt
          retention-days: 30

  # ── Desktop (Rust/Slint) ──────────────────────────────────────
  desktop:
    name: Desktop – Build & Test
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"
      - name: Install Slint dependencies (Linux)
        timeout-minutes: 10
        run: |
          apt_opts=(-o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get update "${apt_opts[@]}"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${apt_opts[@]}" \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            libasound2-dev
      - name: Build
        run: cargo build -p bedrud-desktop
      - name: Test
        run: cargo test -p bedrud-desktop

  # ── Site (Astro landing + public docs) ─────────────────────────
  # Not part of the Go binary / Docker image.
  # If ONLY docs/ (or apps/site) changes, this is the only product-ish job that runs.
  site:
    name: Site – Build & Check
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
          cache: true
      - run: bun install --frozen-lockfile
      - name: Sync swagger.json from server
        run: mkdir -p public && cp ../../server/docs/swagger.json public/swagger.json
      - run: bun run check
      - run: bun run typecheck:astro
      - run: bun run build
