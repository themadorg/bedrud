version: 2

updates:
  # Go server dependencies
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(server)"
    groups:
      go-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    # gorm.io/driver/postgres 1.6.1 rewrote Migrator.DropIndex to qualify the
    # index with the current schema, and the default schema is the expression
    # CURRENT_SCHEMA(), so it emits DROP INDEX CURRENT_SCHEMA()."idx_rooms_name"
    # — rejected as a syntax error, SQLSTATE 42601, on PostgreSQL 15.19.
    # RunMigrations drops that index through the same call, so it is the upgrade
    # path that breaks, not only its test. HasIndex is unaffected: it binds the
    # schema as a parameter rather than splicing it in as an identifier.
    #
    # Only the two broken releases are held. A later one is proposed as usual,
    # and TestRunMigrations_ReplacesLegacyUniqueRoomNameIndex fails on it if the
    # regression is still there.
    ignore:
      - dependency-name: "gorm.io/driver/postgres"
        versions: ["1.6.1", "1.6.2"]

  # Web frontend (npm/bun)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(web)"
    groups:
      npm-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Android (Gradle) — now tracked in the bedrud-android repo's own dependabot config

  # Python agents
  - package-ecosystem: "pip"
    directory: "/agents/music_agent"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(agents)"
    groups:
      pip-agents:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/agents/radio_agent"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(agents)"
    groups:
      pip-agents:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/agents/video_stream_agent"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(agents)"
    groups:
      pip-agents:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Deployment CLI
  - package-ecosystem: "pip"
    directory: "/tools/cli"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(cli)"
    groups:
      pip-cli:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Rust desktop app
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(desktop)"
    groups:
      cargo-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5
