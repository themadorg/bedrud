version: 2

updates:
  # Go server dependencies
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(server)"
    groups:
      go-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    # gorm.io/driver/postgres 1.6.1 rewrote Migrator.DropIndex to qualify the
    # index with the current schema, and the default schema is the expression
    # CURRENT_SCHEMA(), so it emits DROP INDEX CURRENT_SCHEMA()."idx_rooms_name"
    # — rejected as a syntax error, SQLSTATE 42601, on PostgreSQL 15.19.
    # RunMigrations drops that index through the same call, so it is the upgrade
    # path that breaks, not only its test. HasIndex is unaffected: it binds the
    # schema as a parameter rather than splicing it in as an identifier.
    #
    # Only the two broken releases are held. A later one is proposed as usual,
    # and TestRunMigrations_ReplacesLegacyUniqueRoomNameIndex fails on it if the
    # regression is still there.
    ignore:
      - dependency-name: "gorm.io/driver/postgres"
        versions: ["1.6.1", "1.6.2"]

  # Web frontend (bun)
  #
  # The "bun" ecosystem, not "npm": the web app is installed with bun and every
  # CI job runs `bun install --frozen-lockfile`, so a bump that edits
  # package.json without apps/web/bun.lock fails at install. The npm ecosystem
  # does not maintain bun.lock, which is why #175 could never go green — see the
  # note above the pinned bun version in ci.yml. The bun ecosystem updates both
  # files in the same commit.
  #
  # Trade-off: the bun ecosystem covers version updates only. Dependabot alerts
  # still fire for this directory, but it will not raise security-update PRs the
  # way the npm ecosystem did — and those PRs carried the same lockfile drift,
  # so they could not have merged either.
  - package-ecosystem: "bun"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(web)"
    groups:
      npm-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    # apps/web/bunfig.toml sets minimumReleaseAge = 604800, so bun refuses any
    # version published less than 7 days ago and the install fails before a
    # single test runs. Hold the same line here so a version is never proposed
    # before bun will install it. The extra day keeps the boundary from
    # depending on how each side rounds its own unit (days here, seconds there).
    cooldown:
      default-days: 8
    # jsdom 30.1.0 and 30.1.1 break the test suite when vitest runs under
    # Bun's runtime: catchWindowErrors calls window.addEventListener and jsdom
    # answers with "TypeError: 'addEventListener' called on an object that is
    # not a valid instance of EventTarget", killing the worker before each test
    # file runs. The run shrinks from 79 files and 479 tests to 15 and 128, and
    # reports the rest as errors at the end.
    #
    # The runtime is half the trigger. node_modules/.bin/vitest is a
    # `#!/usr/bin/env node` script, so the same jsdom is green wherever node is
    # on PATH and red where bun is the only toolchain installed — the setup
    # AGENTS.md describes. #193 settles that by running `bun --bun vitest run`,
    # matching the build, so the web test job exercises the Bun path and fails
    # on these releases rather than passing over them.
    #
    # Only the two broken releases are held. A later one is proposed as usual,
    # and with #193 merged the web test job is what catches it if the
    # regression survives.
    ignore:
      - dependency-name: "jsdom"
        versions: ["30.1.0", "30.1.1"]

  # Android (Gradle) — now tracked in the bedrud-android repo's own dependabot config

  # Python agents
  - package-ecosystem: "pip"
    directory: "/agents/music_agent"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(agents)"
    groups:
      pip-agents:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/agents/radio_agent"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(agents)"
    groups:
      pip-agents:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/agents/video_stream_agent"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(agents)"
    groups:
      pip-agents:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Deployment CLI
  - package-ecosystem: "pip"
    directory: "/tools/cli"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(cli)"
    groups:
      pip-cli:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Rust desktop app
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(desktop)"
    groups:
      cargo-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5
