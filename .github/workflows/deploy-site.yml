name: Deploy Site to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Landing/docs (apps/site) do not ship in the server binary / Docker image.
  # They only need a rebuild when site content changes, or when server docs/swagger change.
  should-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      site: ${{ steps.decide.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Commit that triggered CI (or current for manual run)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Decide whether site needs deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — always deploy site"
            exit 0
          fi

          HEAD="${{ github.event.workflow_run.head_sha }}"
          # Previous commit on the branch (or empty tree for first push)
          BASE=$(git rev-parse "${HEAD}^" 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "No parent commit — deploy site"
            exit 0
          fi

          # Landing/docs deploy when public site, repo docs/, or server (swagger) change.
          # Product trees (apps/web, desktop) do not force a site deploy.
          if git diff --name-only "$BASE" "$HEAD" | grep -E '^(apps/site/|apps/web/|tools/screenshots/|docs/|server/|\.github/workflows/(ci|deploy-site)\.yml)' >/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "Relevant site/docs/server paths changed — deploy site"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "No apps/site, docs/, or server changes — skip site deploy"
          fi

  build:
    runs-on: ubuntu-latest
    needs: should-deploy
    if: needs.should-deploy.outputs.site == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Import and Export GPG public key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          GPG_KEY=""
          GPG_KEY_ID="$APT_GPG_KEY_ID"
          
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then
            GPG_KEY="$APT_GPG_PRIVATE_KEY"
          elif [ -n "$RPM_GPG_PRIVATE_KEY" ]; then
            GPG_KEY="$RPM_GPG_PRIVATE_KEY"
          fi
          
          if [ -n "$GPG_KEY" ]; then
            echo "$GPG_KEY" | gpg --batch --import
            if [ -z "$GPG_KEY_ID" ]; then
              GPG_KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{print $5; exit}')
            fi
            gpg --armor --export "$GPG_KEY_ID" > apps/site/public/key.gpg
            gpg --armor --export "$GPG_KEY_ID" > apps/site/public/bedrud.gpg.key
            echo "Successfully exported GPG public key to apps/site/public/key.gpg and bedrud.gpg.key"
          else
            echo "⚠ GPG private key not configured in secrets — skipping GPG key export"
          fi
      - name: Sync swagger.json from server
        run: mkdir -p apps/site/public && cp server/docs/swagger.json apps/site/public/swagger.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install Chrome OS libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 || \
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2
      - name: Capture product screenshots
        env:
          BEDRUD_SCREENSHOT_EMAIL: screenshots@bedrud.local
          BEDRUD_SCREENSHOT_PASSWORD: Screenshot1!
        run: bash tools/screenshots/ci-capture.sh
      - uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6
        with:
          package-manager: bun@latest
          path: apps/site

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
